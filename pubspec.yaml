name: tuner
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.4.0
  pitch_detector_dart: ^0.0.7
  record: ^5.0.4
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  go_router: ^14.8.1
  convex_bottom_bar: ^3.2.0
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

